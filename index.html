<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fidélité DressupHT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>Rejoindre la Fidélité DressupHT</h1>
    <p>Inscrivez-vous pour commencer à cumuler des récompenses.</p>

    <!-- Registration Form -->
    <form id="registration-form">

      <label for="first-name">Prénom</label>
      <input type="text" id="first-name" name="first_name" required>

      <label for="last-name">Nom</label>
      <input type="text" id="last-name" name="last_name" required>

      <label for="phone">Numéro de Téléphone</label>
      <input type="tel" id="phone" name="phone" value="+509 " placeholder="+509 XXXX XXXX" required>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email">

      <label for="birthday">Date de naissance (JJ/MM)</label>
      <input type="text" id="birthday" name="birthday" placeholder="JJ/MM" maxlength="5">

      <button type="submit">Devenir Membre Fidélité</button>

    </form>

    <!-- Success View (Hidden by default) -->
    <div id="success-card" class="hidden">
      <h2>Bienvenue, <span id="welcome-name"></span> ! 🎉</h2>
      <p>Votre compte fidélité DressupHT est prêt.</p>
      
      <!-- QR Code Visual Container -->
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>

      <div class="member-id-box">
        <span class="label-small">Votre Identifiant Membre</span>
        <strong id="display-member-id">--</strong>
      </div>

      <p class="instruction-text">Faites une capture d'écran de votre QR code pour de futurs achats.</p>
      
      <button id="reset-btn" class="secondary-btn">Merci de vous avoir inscrit</button>
    </div>

    <p id="message"></p>

  </main>

  <!-- 1. Load config file first -->
  <script src="config.js"></script>
  <!-- 2. Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 3. Initialize Supabase Client globally -->
  <script>
    const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  </script>
  <!-- 4. QRCode.js Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- 5. Main Script -->
  <script src="script.js" defer></script>

</body>
</html>
